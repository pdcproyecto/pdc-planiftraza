<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor Proceso — Packing del Carmen</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#060f1e;font-family:'Segoe UI',Arial,sans-serif}

  /* ── TOP BAR ── */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:52px;
    background:linear-gradient(90deg,#081830 0%,#0d2347 100%);
    border-bottom:2px solid #1a73e8;
    display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100
  }
  #tb-logo{width:32px;height:32px;background:#1a73e8;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
  #tb-brand{font-size:14px;font-weight:700;color:#fff;letter-spacing:.5px}
  #tb-cultivo{font-size:12px;color:#7ab4f5;margin-left:4px}
  #tb-spacer{flex:1}
  #tb-semana{font-size:11px;color:#7ab4f5;margin-right:12px}
  #tb-time{font-size:22px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}

  /* ── MAIN CONTENT ── */
  #main{position:fixed;top:52px;left:0;right:0;bottom:44px;overflow:hidden}

  /* ── SLIDES ── */
  .slide{display:none;width:100%;height:100%;padding:16px 20px}
  .slide.active{display:flex;flex-direction:column}

  /* ── SLIDE TITLE ── */
  .slide-title{
    font-size:15px;font-weight:700;color:#7ab4f5;text-transform:uppercase;letter-spacing:1px;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-shrink:0
  }
  .slide-title .icon{font-size:18px}

  /* ── CARDS GRID ── */
  .kpi-grid{display:grid;gap:12px;flex:1}
  .kpi-card{
    background:#0d1e36;border:1px solid #1a3a5c;border-radius:10px;
    padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between
  }
  .kpi-label{font-size:11px;color:#7ab4f5;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .kpi-val{font-size:36px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
  .kpi-val.big{font-size:46px}
  .kpi-sub{font-size:12px;color:#aac8e8;margin-top:4px}
  .kpi-good{color:#4caf50}
  .kpi-warn{color:#ff9800}
  .kpi-bad{color:#ef5350}

  /* ── TABLE ── */
  .slide-table{width:100%;border-collapse:collapse;font-size:13px;flex:1}
  .slide-table th{
    background:#0d2347;color:#7ab4f5;font-weight:600;text-align:left;
    padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid #1a3a5c
  }
  .slide-table td{
    padding:9px 10px;color:#d0e4f7;border-bottom:1px solid #0d2347;
    vertical-align:middle
  }
  .slide-table tr:last-child td{border-bottom:none}
  .slide-table tbody tr:hover{background:rgba(26,115,232,.07)}

  /* Status badges */
  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;
    font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase
  }
  .badge-green{background:#1b5e20;color:#a5d6a7}
  .badge-orange{background:#e65100;color:#ffe0b2}
  .badge-blue{background:#0d47a1;color:#90caf9}
  .badge-gray{background:#263238;color:#90a4ae}

  /* ── PROGRESS BAR ── */
  #progress-bar-wrap{
    position:fixed;bottom:0;left:0;right:0;height:44px;
    background:#060f1e;border-top:1px solid #0d2347;
    display:flex;align-items:center;padding:0 20px;gap:12px
  }
  #slide-dots{display:flex;gap:6px;align-items:center}
  .dot{
    width:8px;height:8px;border-radius:50%;background:#1a3a5c;transition:background .3s
  }
  .dot.active{background:#1a73e8;width:24px;border-radius:4px}
  #progress-bar-outer{flex:1;height:4px;background:#0d2347;border-radius:2px;overflow:hidden}
  #progress-bar-inner{height:100%;background:#1a73e8;border-radius:2px;width:0%;transition:width linear}
  #progress-label{font-size:11px;color:#7ab4f5;min-width:60px;text-align:right}

  /* ── VIDEO SLIDE ── */
  #video-slide{display:none;width:100%;height:100%}
  #video-slide video{width:100%;height:100%;object-fit:contain;background:#000}

  /* ── LOADING ── */
  #loading-screen{
    position:fixed;inset:0;background:#060f1e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;z-index:999
  }
  .spinner-ring{
    width:48px;height:48px;border:4px solid #1a3a5c;border-top-color:#1a73e8;
    border-radius:50%;animation:spin 1s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-screen p{color:#7ab4f5;font-size:13px}

  /* ── BAR CHART (volumen) ── */
  .bar-chart-wrap{display:flex;align-items:flex-end;gap:20px;flex:1;padding-bottom:8px}
  .bar-group{display:flex;flex-direction:column;align-items:center;flex:1;height:100%}
  .bar-group-label{font-size:11px;color:#7ab4f5;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
  .bar-pair{display:flex;align-items:flex-end;gap:8px;flex:1;width:100%;justify-content:center}
  .bar-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:80px}
  .bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:4px;transition:height .5s}
  .bar-val{font-size:13px;font-weight:700;color:#fff}
  .bar-sub{font-size:10px;color:#7ab4f5;text-align:center}
  .bar-axis{width:100%;height:1px;background:#1a3a5c;margin-top:4px}

  /* No data */
  .no-data{display:flex;flex:1;align-items:center;justify-content:center;color:#3a5a7a;font-size:14px}

  /* Turno header row */
  .turno-header td{
    background:#0a1b33;color:#7ab4f5;font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;padding:6px 10px
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner-ring"></div>
  <p>Cargando visor…</p>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <div id="tb-logo">P</div>
  <div>
    <div id="tb-brand">PACKING DEL CARMEN</div>
    <div id="tb-cultivo">Cargando…</div>
  </div>
  <div id="tb-spacer"></div>
  <div id="tb-semana"></div>
  <div id="tb-time">00:00</div>
</div>

<!-- MAIN CONTENT -->
<div id="main">

  <!-- SLIDE 1: PROGRAMA DE PROCESO (SEGUIMIENTO) -->
  <div class="slide" id="slide-seguimiento">
    <div class="slide-title"><span class="icon">🔄</span>Programa de Proceso Diario</div>
    <div id="seg-groups" style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:4px 0"></div>
  </div>

  <!-- SLIDE 2: VOLÚMENES (desde Indicadores) -->
  <div class="slide" id="slide-volumenes">
    <div class="slide-title"><span class="icon">📦</span>Volúmenes — Acumulado del Año</div>
    <div id="vol-content" style="flex:1;display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <!-- SLIDE 3: INDICADORES (desde Indicadores) -->
  <div class="slide" id="slide-indicadores">
    <div class="slide-title"><span class="icon">📊</span>Indicadores de Desempeño</div>
    <div id="ind-content" style="flex:1;display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <!-- SLIDE: VIDEO -->
  <div class="slide" id="slide-video" style="padding:0;background:#000">
  </div>

  <!-- SLIDE: IMAGEN -->
  <div class="slide" id="slide-imagen" style="padding:0;background:#000;align-items:center;justify-content:center">
  </div>

</div>

<!-- PROGRESS BAR -->
<div id="progress-bar-wrap">
  <div id="slide-dots"></div>
  <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  <div id="progress-label">—</div>
</div>

<!-- YouTube IFrame API (carga asíncrona) -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ============================================================
// VISOR PROCESO — KIOSK
// ============================================================
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbyRI9S-qVkN6JwUqnvyKXyu0XxtHF1kdhw3BTwH32vcKTR6ybGGlXiTTpup2Ws2Af9w/exec';
// Lee el visor desde el parámetro URL ?v=1 … ?v=6  (ej: visor_proceso.html?v=1)
// visor_1.html … visor_6.html son redirectores que apuntan aquí con ?v=N
const VISOR_ID = (() => { const v = new URLSearchParams(window.location.search).get('v'); if (!v) return 'default'; return v.startsWith('v') ? v : 'v' + v; })();

// Estado global
let _config  = {};
let _data    = {};
let _slides  = [];        // slides resueltos: [{tipo, duracion, videoUrl}]
let _current = 0;        // índice actual en _slides
let _timer   = null;     // setInterval del carrusel
let _progress= null;     // setInterval del progress bar
let _loaded  = false;

// YouTube IFrame API
let _ytPlayer    = null;
let _ytAPIReady  = false;
let _currentYtId = null;

window.onYouTubeIframeAPIReady = function() {
  _ytAPIReady = true;
  // Si hay un slide de video activo esperando al API, arrancarlo
  if (_slides.length && _slides[_current] && _slides[_current].tipo === 'video') {
    renderVideo(_slides[_current].videoUrl);
  }
};

// ── UTILIDADES ──────────────────────────────────────────────
function fmt(n, dec=1){
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-PE',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtInt(n){ return n==null||isNaN(n)?'—':Math.round(n).toLocaleString('es-PE'); }
function fmtPct(n){ return n==null||isNaN(n)?'—':fmt(n,1)+'%'; }
function fmtHora(h){ return h ? String(h).slice(0,5) : '—'; }

function getISOWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
}

// ── RELOJ ────────────────────────────────────────────────────
function tickClock(){
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('tb-time').textContent = hh + ':' + mm;
}
setInterval(tickClock, 1000);
tickClock();

// ── CARGA DE DATOS ───────────────────────────────────────────
async function fetchData(){
  try {
    const url = GAS_URL + '?visor=proceso&visorId=' + encodeURIComponent(VISOR_ID);
    const r   = await fetch(url);
    const json = await r.json();
    if (!json.ok && !json.success) throw new Error('API error');
    return json;
  } catch(e) {
    console.warn('fetchData error:', e);
    return null;
  }
}

async function loadAndRefresh(){
  const raw = await fetchData();
  if (!raw) return;

  if (!_loaded) {
    _config = raw.config || {};

    // Header: cultivo/línea provienen de la config del servidor
    const cultivo = _config.cultivo || 'TODOS';
    const linea   = _config.linea   || 'TODAS';
    const cultivoLabel = cultivo === 'TODOS' ? 'Todos los cultivos' : cultivo;
    const lineaLabel   = linea   === 'TODAS' ? '' : ' · L.' + linea;
    document.getElementById('tb-cultivo').textContent = cultivoLabel + lineaLabel;

    // Fecha activa en header
    const week       = getISOWeek(new Date());
    const fechaActiva = _config.fechaActiva || '';
    let fechaLabel = '';
    if (fechaActiva) {
      const [fy, fm, fd] = fechaActiva.split('-');
      const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      fechaLabel = fd + ' ' + (meses[parseInt(fm,10)-1] || fm) + ' ' + fy;
    }
    document.getElementById('tb-semana').textContent = fechaLabel
      ? ('Sem ' + week + ' · ' + fechaLabel)
      : ('Semana ' + week);

    // Construir slides (fallback si no hay config)
    _slides = (_config.slides && _config.slides.length)
      ? _config.slides
      : [
          {tipo:'seguimiento', duracion: _config.duracionDefault || 15},
          {tipo:'volumenes',   duracion: _config.duracionDefault || 15},
          {tipo:'indicadores', duracion: _config.duracionDefault || 15}
        ];

    buildDots();
    _loaded = true;
    document.getElementById('loading-screen').style.display = 'none';
  }

  // Debug: log info de Indicadores para diagnóstico
  if (raw._debug) console.log('[VISOR DEBUG Indicadores]', JSON.stringify(raw._debug));

  // dataPorSlide keyed by "tipo_idx"
  _data = raw.dataPorSlide || {};
  _data._debug = raw._debug || null;
  _data._rawKeys = Object.keys(raw.dataPorSlide || {});

  // ── Overlay diagnóstico visual (presiona D en teclado para mostrar/ocultar) ──
  _showDiagOverlay(raw);

  renderCurrentSlide();
}

function _showDiagOverlay(raw){
  let ov = document.getElementById('_diag-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = '_diag-overlay';
    ov.style.cssText = 'position:fixed;top:52px;right:0;width:420px;max-height:60vh;overflow-y:auto;background:rgba(5,12,24,.96);border-left:2px solid #1a73e8;border-bottom:2px solid #1a73e8;z-index:9999;padding:10px 12px;font-size:11px;font-family:monospace;color:#a0c8f0;display:none';
    document.body.appendChild(ov);
    document.addEventListener('keydown', e => { if(e.key==='d'||e.key==='D') ov.style.display = ov.style.display==='none'?'block':'none'; });
  }
  const dbg = raw._debug || {};
  const dps = raw.dataPorSlide || {};
  const lines = [
    '<b style="color:#fff">── DIAGNÓSTICO GAS ──</b>  <span style="color:#666">[D] para cerrar</span>',
    'Ind filas: ' + (dbg.totalRows||'?') + '  años: ' + (dbg.anosDisp?dbg.anosDisp.join(','):'?'),
    'Ind última fecha: ' + (dbg.sample&&dbg.sample[0]?String(dbg.sample[0].fecha_proceso)+'  sem:'+dbg.sample[0].semana+' cult:'+dbg.sample[0].cultivo:'?'),
    'dataPorSlide keys: ' + JSON.stringify(Object.keys(dps)),
    '─────────────────────',
    ...Object.entries(dps).map(([k,v]) => {
      if (k==='_debug'||k==='_rawKeys') return null;
      if (Array.isArray(v)) return k + ' → filas:'+v.length;
      const diag = v._diag;
      let info = 'kgProc:'+(v.kgProc||0)+' hist:'+(v.historico?v.historico.length:0);
      if (diag) info += ' | año:'+diag.anio+' tot:'+diag.rowsTotal+' preF:'+diag.rowsAntesFiltro+' postF:'+diag.rowsDespuesFiltro+' cultFiltro:'+diag.cultivoFiltro+' cult0:['+(diag.cultivosEnDatos||[]).slice(0,3).join(',')+']';
      return k + ' → ' + info;
    }).filter(Boolean),
    '─────────────────────',
    'config slides: ' + JSON.stringify((_config.slides||[]).map(s=>s.tipo+'('+s.cultivo+'/'+s.proceso+')')),
    'fechaActiva: ' + (_config.fechaActiva||'?')
  ];
  ov.innerHTML = lines.join('<br>');
  // Auto-mostrar solo la primera vez
  if (ov.style.display === 'none' && !ov.dataset.shown) {
    ov.style.display = 'block';
    ov.dataset.shown = '1';
    setTimeout(() => { ov.style.display = 'none'; }, 20000); // se oculta solo a los 20s
  }
}

// ── CARRUSEL ─────────────────────────────────────────────────
function buildDots(){
  const wrap = document.getElementById('slide-dots');
  wrap.innerHTML = _slides.map((_,i) => `<div class="dot" id="dot-${i}"></div>`).join('');
}

function goToSlide(idx){
  // Ocultar todos
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  // Limpiar timer anterior
  if (_timer) { clearInterval(_timer); _timer = null; }
  if (_progress) { clearInterval(_progress); _progress = null; }
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));

  _current = ((idx % _slides.length) + _slides.length) % _slides.length;
  const slide = _slides[_current];
  const dot = document.getElementById('dot-'+_current);
  if (dot) dot.classList.add('active');

  // Renderizar contenido
  renderCurrentSlide();

  // Mostrar slide
  const slideEl = getSlideEl(slide.tipo);
  if (slideEl) slideEl.classList.add('active');

  // Para YouTube: el video mismo controla el avance (onStateChange: ENDED)
  const isYTVideo = slide.tipo === 'video' && slide.videoUrl && _youtubeId(slide.videoUrl);
  if (isYTVideo) {
    // Mostrar indicador "reproduciendo" en la barra
    const inner = document.getElementById('progress-bar-inner');
    const label = document.getElementById('progress-label');
    if (inner) { inner.style.transition='none'; inner.style.width='0%'; }
    if (label) label.textContent = '▶';
    // Sin timer — el evento onStateChange: ENDED llamará goToSlide
    return;
  }

  // Progress bar + auto-avance normal
  const dur = (slide.duracion || _config.duracionDefault || 15) * 1000;
  startProgressBar(dur, slide);
  _timer = setTimeout(() => goToSlide(_current + 1), dur);
}

function getSlideEl(tipo){
  // Mapeo de tipo de slide → id del div
  const map = {
    video:       'slide-video',
    imagen:      'slide-imagen',
    seguimiento: 'slide-seguimiento',
    volumenes:   'slide-volumenes',
    indicadores: 'slide-indicadores'
  };
  const id = map[tipo] || ('slide-' + tipo);
  return document.getElementById(id);
}

function startProgressBar(durMs, slide){
  const inner = document.getElementById('progress-bar-inner');
  const label = document.getElementById('progress-label');
  inner.style.transition = 'none';
  inner.style.width = '0%';

  const start = Date.now();
  const end   = start + durMs;

  _progress = setInterval(() => {
    const elapsed = Date.now() - start;
    const pct = Math.min(100, elapsed / durMs * 100);
    inner.style.transition = 'none';
    inner.style.width = pct + '%';
    const rem = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    label.textContent = rem + 's';
    if (pct >= 100) { clearInterval(_progress); _progress = null; }
  }, 250);
}

// ── RENDER SLIDES ────────────────────────────────────────────
function slideData(tipo, idx){
  // Datos del server keyed por "tipo_idx"
  return _data[tipo + '_' + idx] || (tipo === 'seguimiento' ? [] : {});
}

function renderCurrentSlide(){
  const slide = _slides[_current];
  if (!slide) return;
  const d = slideData(slide.tipo, _current);
  if      (slide.tipo === 'seguimiento') renderSeguimiento(d);
  else if (slide.tipo === 'volumenes')   renderVolumenes(d);
  else if (slide.tipo === 'indicadores') renderIndicadores(d);
  else if (slide.tipo === 'video')       renderVideo(slide.videoUrl);
  else if (slide.tipo === 'imagen')      renderImagen(slide.imagenUrl);
}


// ── SLIDE 2: VOLÚMENES ───────────────────────────────────────
function renderVolumenes(d){
  const el = document.getElementById('vol-content');
  const dbg = _data._debug || {};
  const dbgBar = `<div style="font-size:10px;color:#3a6080;padding:3px 8px;background:#050c18;border-radius:3px;margin-bottom:6px;font-family:monospace">
    filas:${dbg.totalRows||'?'} · fecha0:${dbg.sample&&dbg.sample[0]?String(dbg.sample[0].fecha_proceso).substring(0,20):'?'} · kgProc:${d?d.kgProc||0:'N/A'} · semanas:${d&&d.historico?d.historico.length:0}
  </div>`;
  if (!d || !d.historico) {
    el.innerHTML = dbgBar + '<div class="no-data">Sin datos de volumen disponibles</div>';
    return;
  }

  const { kgProc=0, kgExp=0, pctExp=0, historico=[] } = d;
  const objPct = (_config.slides[_current] && _config.slides[_current].objetivoExportable)
                 || null; // si se guarda en config de slide

  const pctColor = pctExp >= 75 ? '#4caf50' : pctExp >= 60 ? '#ff9800' : '#ef5350';

  const maxKg = Math.max(...historico.map(h => Math.max(h.kgProc, h.kgExp)), 1);

  const barRows = historico.map(h => {
    const wProc  = Math.max(3, Math.round(h.kgProc / maxKg * 100));
    const wExp   = Math.max(3, Math.round(h.kgExp  / maxKg * 100));
    const pctSem = h.kgProc > 0 ? Math.round(h.kgExp / h.kgProc * 100) : 0;
    const pctCol = pctSem >= 85 ? '#4caf50' : pctSem >= 70 ? '#ff9800' : '#ef5350';
    const kgProcK = h.kgProc >= 1000000 ? (h.kgProc/1000000).toFixed(1)+'M' : Math.round(h.kgProc/1000)+'k';
    const kgExpK  = h.kgExp  >= 1000000 ? (h.kgExp /1000000).toFixed(1)+'M' : Math.round(h.kgExp /1000)+'k';
    return `
      <div style="display:grid;grid-template-columns:38px 1fr 52px;align-items:center;gap:8px;margin-bottom:7px">
        <div style="font-size:12px;color:#5a9fd4;font-weight:700;text-align:right">S${h.semana}</div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div style="position:relative;height:17px;background:#0a1828;border-radius:3px">
            <div style="width:${wProc}%;height:100%;background:#1e4a80;border-radius:3px;min-width:3px;position:relative">
              <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#a8d4f5;white-space:nowrap">${kgProcK}</span>
            </div>
          </div>
          <div style="position:relative;height:17px;background:#0a1828;border-radius:3px">
            <div style="width:${wExp}%;height:100%;background:#1a73e8;border-radius:3px;min-width:3px;position:relative">
              <span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#e3f2ff;white-space:nowrap">${kgExpK}</span>
            </div>
          </div>
        </div>

  const badge = (val, obj, unit='') => {
    const c = color(val, obj);
    const pct = obj && val ? Math.round(val/obj*100) : null;

// ── SLIDE 1: SEGUIMIENTO (Programa de proceso) ───────────────
function isCerrado(status) {
  const s = String(status||'').toLowerCase();
  return (s.includes('proces') && !s.includes('en proc')) ||
         s.includes('complet') || s.includes('termin') || s.includes('finaliz');
}
function isEnPiso(status) {
  return String(status||'').toLowerCase().includes('piso');
}
function diffHoras(h1, h2) {
  // h1, h2 formato "HH:MM" o "HH:MM:SS"
  const p = s => { const [hh,mm] = String(s||'').split(':'); return (parseInt(hh)||0)*60+(parseInt(mm)||0); };
  const d = p(h2) - p(h1);
  if (d <= 0 || !h1 || !h2) return '—';
  const hh = Math.floor(d/60), mm = d%60;
  return (hh > 0 ? hh + 'h ' : '') + mm + 'm';
}

  rows = Array.isArray(rows) ? rows : [];

  // Ordenar ítems dentro de cada grupo por campo `orden`
  groupOrder.forEach(key => {
    groupMap[key].items.sort((a,b) => (a.orden||0) - (b.orden||0));

  wrap.innerHTML = groupOrder.map(key => {
    const g = groupMap[key];

    // ── Encabezado ──

    // ── Resumen del grupo ──
    const kgProg = g.items.reduce((s,r) => s + (r.kg_recibidos||0), 0);
    const cerrados = g.items.filter(r => isCerrado(r.status));
    const kgProc  = cerrados.reduce((s,r) => s + (r.kg_recibidos||0), 0);
    const avance  = kgProg > 0 ? (kgProc/kgProg*100).toFixed(1) : '0.0';
    const tnhAvg  = cerrados.length
      ? (cerrados.reduce((s,r) => s + (r.tn_hora_real||0), 0) / cerrados.length).toFixed(1)

    // Hora inicio: el menor hora_inicio de todos los que tienen

        </div>

          <div style="font-size:18px;color:#c8e8ff;font-weight:700">${hIni} → ${hFin}

    return `

              <th style="text-align:center;padding:7px 16px;font-size:13px;color:#4a90d9;font-weight:700;letter-spacing:.5px;text-transform:uppercase">Tn/h Real</th>
              <th style="text-align:center;padding:7px 16px;font-size:13px;color:#4a90d9;font-weight:700;letter-spacing:.5px;text-transform:uppercase">Estado</th>
              <th style="text-align:center;padding:7px 16px;font-size:13px;color:#4a90d9;font-weight:700;letter-spacing:.5px;text-transform:uppercase">Inicio</th>

function _driveFileId(url) {
  const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m1) return m1[1];
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m2) return m2[1];
  return null;
}
function _youtubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function _createYTPlayer(videoId) {
  const wrap = document.getElementById('slide-video');
  if (!wrap) return;
  wrap.innerHTML = '<div id="yt-host" style="width:100%;height:100%"></div>';
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; }
  _currentYtId = videoId;

  _ytPlayer = new YT.Player('yt-host', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1, mute: 1, controls: 0, rel: 0,
      showinfo: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1
    },
    events: {
      onReady: e => { e.target.playVideo(); },
      onStateChange: e => {
        // YT.PlayerState.ENDED = 0
        if (e.data === 0) goToSlide(_current + 1);
      }
    }
  });
}

          Pega una URL de <b style="color:#8ab8e0">YouTube</b> en el panel admin<br>
          <span style="color:#2a4a60">(Recomienda: subir como "No listado")</span>
        </div>
      </div>`;
    return;
  }

  // ── YouTube → IFrame API (autoplay real + detectar fin) ──
  const ytId = _youtubeId(url);
  if (ytId) {
    if (!_ytAPIReady) {
      // API aún no lista → mostrar cargando y reintentar
      wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
        height:100%;background:#050c18;color:#5a9fd4;font-size:16px">⏳ Cargando reproductor…</div>`;
      setTimeout(() => {
        if (_slides[_current] && _slides[_current].tipo === 'video') renderVideo(url);
      }, 600);
      return;
    }
    // Mismo video ya en el player → solo reiniciar desde el principio
    if (_ytPlayer && _currentYtId === ytId) {
      try { _ytPlayer.seekTo(0); _ytPlayer.playVideo(); } catch(e){ _createYTPlayer(ytId); }
      return;
    }
    _createYTPlayer(ytId);
    return;
  }

  // ── Google Drive → iframe preview ──
  if (url.includes('drive.google.com')) {
    const fid = _driveFileId(url);
    const previewUrl = fid ? `https://drive.google.com/file/d/${fid}/preview` : url;
    const existing = wrap.querySelector('iframe[data-driveid]');
    if (existing && existing.dataset.driveid === (fid||url)) return;
    if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; _currentYtId = null; }
    wrap.innerHTML = `
      <div style="position:relative;width:100%;height:100%;overflow:hidden;background:#000">
        <iframe data-driveid="${fid||url}" src="${previewUrl}"
          style="position:absolute;top:-55px;left:0;width:100%;height:calc(100% + 110px);border:none"
          allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div id="drive-warn" style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
             background:rgba(5,12,24,.88);border:1px solid #1a3a5c;border-radius:6px;
             padding:5px 14px;font-size:11px;color:#5a9fd4;white-space:nowrap;pointer-events:none">
          ⏳ Si no carga: Drive tarda ~5 min en procesar. Recomendado: YouTube.
        </div>
      </div>`;
    setTimeout(() => { const w = document.getElementById('drive-warn'); if(w) w.style.display='none'; }, 8000);
    return;
  }

  // ── URL directa de video (mp4, webm) → <video> tag ──
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; _currentYtId = null; }
  let vid = wrap.querySelector('video');
  if (!vid) {
    wrap.innerHTML = '<video autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;background:#000"></video>';
    vid = wrap.querySelector('video');
  }
  vid.onended = () => goToSlide(_current + 1);
  if (vid.getAttribute('data-src') !== url) {
    vid.setAttribute('data-src', url);
    vid.src = url;
    vid.load();
  }
  vid.play().catch(()=>{});
}

// ── SLIDE 5: IMAGEN ───────────────────────────────────────────
function renderImagen(url) {
  const wrap = document.getElementById('slide-imagen');
  if (!wrap) return;
  if (!url) {
    wrap.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                  height:100%;background:#050c18;color:#5a9fd4;gap:16px">
        <div style="font-size:64px">🖼️</div>
        <div style="font-size:22px;font-weight:700;color:#a0c8f0">Sin imagen configurada</div>
        <div style="font-size:13px;color:#3a6080">Sube una imagen desde el panel admin</div>
      </div>`;
    return;
  }
  // Google Drive image → URL de vista directa
  let imgUrl = url;
  if (url.includes('drive.google.com')) {
    const fid = _driveFileId(url);
    if (fid) imgUrl = `https://drive.google.com/uc?export=view&id=${fid}`;
  }
  // Evitar re-render si es la misma imagen
  const existing = wrap.querySelector('img');
  if (existing && existing.src === imgUrl) return;
  wrap.innerHTML = `
    <img src="${imgUrl}"
         style="max-width:100%;max-height:100%;object-fit:contain"
         onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend',
           '<div style=\\'color:#ef5350;font-size:16px;padding:20px\\'>⚠ No se pudo cargar la imagen</div>')">`;
}

// ── HELPERS ──────────────────────────────────────────────────
function statusToBadge(status){
  const s = String(status||'').toLowerCase();
  if (s.includes('proceso') || s.includes('progreso') || s.includes('activo'))
    return '<span class="badge badge-green">En Proceso</span>';
  if (s.includes('pend'))
    return '<span class="badge badge-orange">Pendiente</span>';
  if (s.includes('complet') || s.includes('termin') || s.includes('finaliz'))
    return '<span class="badge badge-blue">Completado</span>';
  return `<span class="badge badge-gray">${status||'—'}</span>`;
}

// ── ARRANQUE ─────────────────────────────────────────────────
async function init(){
  await loadAndRefresh();

  // Si no hay slides, mostrar mensaje
  if (!_slides.length) {
    document.getElementById('loading-screen').style.display = 'none';
    return;
  }

  // Iniciar carrusel
  goToSlide(0);

  // Refresh periódico de datos
  const refreshMs = (_config.refreshInterval || 60) * 1000;
  setInterval(async () => {
    await loadAndRefresh();
  }, refreshMs);
}

init();
</script>
